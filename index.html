<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0e0f14" />
    <title>NearCaster</title>
    <link rel="icon" href="/icon.png" />
    <!--miniapp-embed-->
  </head>
  <body>
    <div id="app">
      <header id="bar">
        <div id="brand"><span class="dot"></span>NearCaster</div>
        <input id="search" type="search" placeholder="Search names (regex)" autocomplete="off" spellcheck="false" />
        <span id="count"></span>
        <button id="menuBtn" class="icon" aria-label="Controls" aria-expanded="false">☰</button>
      </header>
      <main id="stage">
        <section id="controls" hidden>
          <div class="row">
            <span class="pair">
              <label>View</label>
              <div class="seg" id="mode">
                <button data-mode="focus">Focus</button>
                <button data-mode="context">Context</button>
                <button data-mode="all" class="on">All</button>
              </div>
            </span>
            <span class="pair">
              <label>Links</label>
              <div class="links-row">
                <button id="linksAll" class="on" aria-pressed="true">All</button>
                <div class="seg" id="links">
                  <button data-links="mutual" class="on" aria-pressed="true"><i class="tie mutual"></i>Mutual</button>
                  <button data-links="following" class="on" aria-pressed="true"><i class="tie out"></i>Following</button>
                  <button data-links="follows" class="on" aria-pressed="true"><i class="tie in"></i>Follows</button>
                </div>
              </div>
            </span>
          </div>
          <div class="row">
            <span class="pair">
              <label for="hulls">Community hulls</label>
              <input id="hulls" type="checkbox" checked />
            </span>
            <span class="pair grow">
              <label for="depth">Depth <span id="depthVal">1</span></label>
              <input id="depth" type="range" min="0" max="4" step="1" value="1" />
            </span>
            <span class="pair grow">
              <label for="time">Time <span id="timeVal" class="num">all</span></label>
              <span class="track"><i class="tick"></i><input id="time" type="range" min="0" step="1" /></span>
            </span>
          </div>
          <div class="row">
            <label for="fid">Center on fid or @username</label>
            <form id="fidForm"><input id="fid" placeholder="3 or @dwr" autocapitalize="off" autocorrect="off" spellcheck="false" /><button type="submit">Go</button></form>
          </div>
          <div class="row small" id="source"></div>
        </section>
        <svg id="graph" role="img" aria-label="Friends-of-friends graph"></svg>
        <div id="status" class="status"></div>
        <div id="toast" hidden></div>
        <div id="legend"></div>
        <button id="undoBtn" class="icon fab" aria-label="Back to the previous graph" disabled>↶</button>
        <button id="redoBtn" class="icon fab" aria-label="Forward to the next graph" disabled>↷</button>
        <button id="fitBtn" class="icon fab" aria-label="Fit graph">⤢</button>
        <button id="meBtn" hidden>My network</button>
        <button id="addBtn" hidden>+ Add NearCaster</button>
        <aside id="panel" hidden></aside>
        <div id="peek" hidden></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
